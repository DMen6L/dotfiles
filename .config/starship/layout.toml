"$schema" = "https://starship.rs/config-schema.json"

# This is the editable prompt layout. scripts/theme.lua writes the active
# palette into starship.toml whenever a desktop theme is applied.
add_newline = false
palette = "active"

# One-line Powerline prompt: identity and location stay in the fixed left
# capsule; project-aware modules appear only when their project is detected.
format = '''[](panel)$os$username[](fg:panel bg:panel_alt)$directory[](panel_alt) $git_branch$git_status$nodejs$python$rust$golang$lua$character'''

[palettes.active]
__THEME_PALETTE__

[os]
disabled = false
format = "[ $symbol ](bg:panel fg:ornament_text)"

[os.symbols]
Arch = "󰣇"
Artix = "󰣇"

[username]
show_always = true
format = "[ $user ]($style)"
style_root = "bg:panel fg:urgent"
style_user = "bg:panel fg:text"

[directory]
format = "[ $path ]($style)"
style = "bg:panel_alt fg:text"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Developer = "󰲋 "
Documents = "󰈙 "
Downloads = " "
Music = "󰝚 "
Pictures = " "

[git_branch]
symbol = ""
format = "[ $symbol $branch ]($style)"
style = "fg:accent"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "fg:urgent"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘${count}"

# Native runtime modules replace the old manual custom-icon chooser. They
# appear only for a matching project, and therefore add no idle prompt cost.
[nodejs]
symbol = "󰎙"
format = "[ $symbol $version ]($style)"
style = "fg:success"

[python]
symbol = ""
format = "[ $symbol $pyenv_prefix$version ]($style)"
style = "fg:accent_alt"

[rust]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:accent"

[golang]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:success"

[lua]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:accent_alt"

[character]
format = "$symbol "
success_symbol = "[❯](bold fg:accent_alt)"
error_symbol = "[❯](bold fg:urgent)"
vimcmd_symbol = "[❮](bold fg:accent)"
