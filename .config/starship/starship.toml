"$schema" = "https://starship.rs/config-schema.json"

# This is the editable prompt layout. scripts/theme.lua writes the active
# palette into starship.toml whenever a desktop theme is applied.
add_newline = false
palette = "active"

# One-line Powerline prompt: identity and location stay in the fixed left
# capsule; project-aware modules appear only when their project is detected.
format = '''[](prompt_identity_bg)$os$username[](fg:prompt_identity_bg bg:prompt_directory_bg)$directory[](prompt_directory_bg) $git_branch$git_status$nodejs$python$rust$golang$lua$character'''

[palettes.active]
background = "#101417"
panel = "#1c2024"
panel_alt = "#262a2e"
text = "#dfe3e7"
muted = "#c1c7ce"
accent = "#92cef5"
accent_alt = "#5cc4ff"
success = "#54d341"
urgent = "#ffb4ab"
ornament_text = "#c7e7ff"
shadow = "#000000"
prompt_identity_bg = "#00344c"
prompt_directory_bg = "#004c6c"

[os]
disabled = false
format = "[ $symbol ](bg:prompt_identity_bg fg:ornament_text)"

[os.symbols]
Arch = "󰣇"
Artix = "󰣇"

[username]
show_always = true
format = "[ $user ]($style)"
style_root = "bg:prompt_identity_bg fg:urgent"
style_user = "bg:prompt_identity_bg fg:text"

[directory]
format = "[ $path ]($style)"
style = "bg:prompt_directory_bg fg:text"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
Developer = "󰲋 "
Documents = "󰈙 "
Downloads = " "
Music = "󰝚 "
Pictures = " "

[git_branch]
symbol = ""
format = "[ $symbol $branch ]($style)"
style = "fg:accent"

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "fg:urgent"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "≡"
modified = "!${count}"
staged = "+${count}"
renamed = "»"
deleted = "✘${count}"

# Native runtime modules replace the old manual custom-icon chooser. They
# appear only for a matching project, and therefore add no idle prompt cost.
[nodejs]
symbol = "󰎙"
format = "[ $symbol $version ]($style)"
style = "fg:success"

[python]
symbol = ""
format = "[ $symbol $pyenv_prefix$version ]($style)"
style = "fg:accent_alt"

[rust]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:accent"

[golang]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:success"

[lua]
symbol = ""
format = "[ $symbol $version ]($style)"
style = "fg:accent_alt"

[character]
format = "$symbol "
success_symbol = "[❯](bold fg:accent_alt)"
error_symbol = "[❯](bold fg:urgent)"
vimcmd_symbol = "[❮](bold fg:accent)"
