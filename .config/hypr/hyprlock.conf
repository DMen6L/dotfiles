# Shared desktop colors; generated by scripts/theme.lua.
source = ~/.config/hypr/colors/active.conf

background {
    monitor =
    # Keep the lock screen on the same artwork as the desktop.
    path = /home/dmensxl/.config/assets/images/Cloudsday.jpg
    blur_passes = 2
    blur_size = 4
}

input-field {
    monitor =
    size = 380, 58
    position = 0, -72
    halign = center
    valign = center

    # A high-contrast field makes the entry state and typed-dot count clear.
    outline_thickness = 3
    rounding = 10
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    hide_input = false

    outer_color = $themeAccent
    inner_color = $themePanel
    font_color = $themeText
    check_color = $themeSuccess
    fail_color = $themeUrgent
    capslock_color = $themeCapsLock

    fade_on_empty = false
    placeholder_text = Type your password
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    font_family = JetBrainsMono Nerd Font
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    font_size = 90
    color = $themeText
    font_family = JetBrainsMono Nerd Font
    position = 0, 130
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome back, $USER
    font_size = 22
    color = $themeAccent
    font_family = JetBrainsMono Nerd Font
    position = 0, 12
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter your password to unlock
    font_size = 14
    color = $themeMuted
    font_family = JetBrainsMono Nerd Font
    position = 0, -15
    halign = center
    valign = center
}

label {
    monitor =
    text = Keyboard: $LAYOUT[EN, RU, KZ]
    font_size = 14
    color = $themeAccent
    font_family = JetBrainsMono Nerd Font
    position = 0, -132
    halign = center
    valign = center
}

label {
    monitor =
    # Keep this empty until Caps Lock is actually enabled.
    text = cmd[update:1000] hyprctl devices -j | jq -r 'if any(.keyboards[]; .capsLock) then "CAPS LOCK IS ON" else "" end'
    font_size = 13
    color = $themeCapsLock
    font_family = JetBrainsMono Nerd Font
    position = 0, -158
    halign = center
    valign = center
}
